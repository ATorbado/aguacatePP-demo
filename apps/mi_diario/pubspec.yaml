name: mi_diario
description: Mi Diario
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  share_plus: ^12.0.1
  file_picker: ^10.3.7
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.2
  shared_preferences: ^2.5.3
  workmanager: ^0.9.0+3

  http: ^1.4.0
  cryptography: ^2.7.0
  package_info_plus: ^8.0.0

  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/diarioCerrado.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/diarioCerrado.png"
  min_sdk_android: 24
